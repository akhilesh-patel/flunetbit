[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Storage       On
    Storage_Path  /fluent-bit/storage/
    HTTP_Server   On
    HTTP_Port     2020
    HTTP_Listen   0.0.0.0

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /fluent-bit/logs.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Add Docker input plugin to get container metadata directly from Docker API
[INPUT]
    Name              docker
    Tag               docker_api
    Interval_Sec      10

# Match docker logs first - this will enrich with container ID
[FILTER]
    Name              record_modifier
    Match             docker.*
    Record            hostname ${HOSTNAME}

# Apply the Lua scripts for extracting container name and service name
[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_name.lua
    Call              extract_container_name

[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_service.lua
    Call              extract_service_name

# Add debugging output to see what's being extracted (comment out in production)
[OUTPUT]
    Name              stdout
    Match             docker.*
    Format            json_lines

# Send logs to Loki with the extracted labels
[OUTPUT]
    Name              loki
    Match             docker.*
    Host              3.110.166.52
    Port              3100
    URI               /loki/api/v1/push
    Labels            job=fluentbit,container_id=$container_id,container_name=$container_name,service_name=$service_name,host=$hostname
    Line_Format       json
    Retry_Limit       5
    Workers           1
