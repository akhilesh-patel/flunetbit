version: '3'

services:
  app:
    image: akhileshpatel123/react-app
    container_name: app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    ports:
      - 8081:80
    labels:

      - "container_name=app"
      - "service_name=app"
  postgres:
    image: postgres:13.21-alpine3.20
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: testdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    labels:
      - "container_name=postgres"
      - "service_name=postgres-database"
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    labels:
      - "container_name=mysql"
      - "service_name=database"

  nginx:
    image: nginx
    container_name: nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    ports:
      - 80:80
    labels:

      - "container_name=nginx"
      - "service_name=webserver"

  fluent-bit:
    image: fluent/fluent-bit:2.1.9
    container_name: fluent-bit
    env_file:
     ./container_service_list_env 
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./parsers.conf:/fluent-bit/etc/parsers.conf
      - ./extract_container_name.lua:/fluent-bit/etc/extract_container_name.lua
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/tmp
    depends_on:
      - loki
    
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./local-config.yaml:/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    depends_on:
      - loki

volumes:
  grafana-storage:
  fluent-bit-state:
