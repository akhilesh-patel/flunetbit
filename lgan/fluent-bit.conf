[SERVICE]
    Flush               5
    Daemon              Off
    Log_Level           info
    Storage.path        /fluentbit-storage
    Storage.sync        normal
    Storage.checksum    off
    Storage.backlog.mem_limit 50MB
    HTTP_Server         On
    HTTP_Listen         0.0.0.0
    HTTP_Port           2020

[INPUT]
    Name                tail
    Tag                 docker.*
    Path                /var/lib/docker/containers/*/*.log
    Parser              docker
    DB                  /fluentbit-storage/logs.db
    Mem_Buf_Limit       5MB
    Skip_Long_Lines     On
    Refresh_Interval    10
    Buffer_Chunk_Size   32k
    Buffer_Max_Size     512k
    Read_from_Head      true

# Match docker logs first - this will enrich with container ID
[FILTER]
    Name              record_modifier
    Match             docker.*
    Record            hostname ${HOSTNAME}
    
# Apply the Lua scripts for extracting container name and service name
[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_name.lua
    Call              extract_container_name

[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_service.lua
    Call              extract_service_name

# Print to stdout for debugging
[OUTPUT]
    Name                stdout
    Match               docker.*
    Format              json_lines

# Send logs to Loki
[OUTPUT]
    Name              loki
    Match             docker.*
    Host              13.201.223.194
    Port              3100
    Labels            job=fluentbit,container_name=$container_name,service_name=$service_name,host=$hostname
    Line_Format       json
    Workers           1
    Compress          true
