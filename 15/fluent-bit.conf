[SERVICE]
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020
    Flush            1
    Log_Level        info
    Parsers_File     parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    multiline.parser  docker
    Tag               containers.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Docker_Mode       On
    DB                /var/log/flb_kube.db

[FILTER]
    Name              modify
    Match             containers.*
    Rename            docker.container_name container_name

[OUTPUT]
    Name              loki
    Match             containers.*
    Host              loki
    Port              3100
    Labels            container_name=$container_name
    Line_Format       json

