[SERVICE]
    Flush             1
    Daemon            Off
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Path_Key          source
    Exclude_Path      /var/lib/docker/containers/fluent-bit*/*
    DB                /tmp/flb_container.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    true

[FILTER]
    Name              grep
    Match             docker.*
    Exclude           source fluent-bit

[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            json
    Reserve_Data      On

[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_container_name.lua
    Call              extract_container_name

[OUTPUT]
    Name              loki
    Match             docker.*
    Host              loki
    Port              3100
    Labels            job=fluentbit,container_name=$container_name,service_name=$service_name
    Label_Keys        $container_name,$service_name
    Line_Format       json

