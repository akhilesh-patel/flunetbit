[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     debug
    Storage       On
    Storage_Path  /fluent-bit/storage/
    HTTP_Server   On
    HTTP_Port     2020
    HTTP_Listen   0.0.0.0
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /fluent-bit/logs.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Add Docker input plugin to get container metadata
[INPUT]
    Name              docker
    Tag               docker_api
    Interval_Sec      10

# Match docker logs and add basic metadata
[FILTER]
    Name              record_modifier
    Match             docker.*
    Record            hostname ${HOSTNAME}
    Record            environment production

# Extract container name
[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_name.lua
    Call              extract_container_name
    Protected_Mode    true

# Extract service name
[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/extract_service.lua
    Call              extract_service_name
    Protected_Mode    true

# Add debugging output
[FILTER]
    Name              grep
    Match             docker.*
    Exclude           log .*fluent-bit.*
    Exclude           log .*loki.*

# Debug output to stdout
[OUTPUT]
    Name              stdout
    Match             docker.*
    Format            json_lines

# Send to Loki with all relevant labels
[OUTPUT]
    Name              loki
    Match             docker.*
    Host              192.168.0.115
    Port              3100
    URI               /loki/api/v1/push
    Labels            job=fluentbit,container_id=$container_id,container_name=$container_name,service_name=$service_name,host=$hostname,environment=production
    Line_Format       json
    Retry_Limit       5
    Workers           1
    Auto_Kubernetes_Labels  off
